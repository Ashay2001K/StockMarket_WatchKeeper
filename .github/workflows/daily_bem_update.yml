name: Daily BEM 100 Post-Market Screener

on:
  schedule:
    # Monday to Friday at 16:00 IST (10:30 UTC), 30 mins after Indian market close
    - cron: '30 10 * * 1-5'
  workflow_dispatch: # Allows manual trigger anytime from GitHub UI

jobs:
  calculate-bem-scores:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run BEM 100 Batch Screener
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          PYTHONUNBUFFERED: "1"
        run: |
          python scripts/daily_batch_screener.py

      - name: Commit Precomputed Screener Cache
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add backend/data/precomputed_screener.json
          if ! git diff --quiet || ! git diff --staged --quiet; then
            git commit -m "Auto-update BEM 100 post-market screener cache [skip ci]"
            git pull --rebase origin main
            git push
          fi
